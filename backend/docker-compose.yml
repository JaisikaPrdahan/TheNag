services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: thenag
      POSTGRES_PASSWORD: thenag_dev
      POSTGRES_DB: thenag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata:
